<title>Maratona Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema único escuro, de propósito: sala de cinema. */
:root{
  color-scheme:dark;
  --bg:#0B0C10; --bg-2:#0F1116; --surface:#15171E; --surface-2:#1C1F28; --surface-3:#262A36;
  --line:#242834; --line-strong:#363B49;
  --ink:#EEEFF3; --muted:#9CA2B0; --faint:#6A7080;
  --doom:#3FBF80; --doom-ink:#04110A; --doom-deep:#0E2E20; --gold:#F5C04A; --focus:#8AB4FF;
  --tempo:#33C98A; --espaco:#5B8EF0; --poder:#A970EA; --realidade:#F0575D; --mente:#F2C230; --alma:#F28C3E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.shell{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}

/* ---------- barra do app ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(11,12,16,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand b{color:var(--doom);font-weight:900}
.tabs{display:flex;gap:4px;margin-left:16px}
.tabs a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tabs svg{width:18px;height:18px}
.me{margin-left:auto;position:relative}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px}
.me-btn .caret{opacity:.6;font-size:11px}
.me-menu{position:absolute;right:0;top:calc(100% + 8px);width:270px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:40}
.me-menu .lbl{padding:6px 8px 2px}
.me-menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px;border-radius:9px;font-weight:500}
.me-menu button:hover{background:var(--surface-2)}
.me-menu button[aria-pressed="true"]{background:var(--surface-3)}
.me-menu p{font-size:12px;color:var(--muted);margin:6px 8px 4px;line-height:1.45}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:45;background:rgba(21,23,30,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs a{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 4px;justify-content:center}
  .me-btn .nm,.me-btn .caret{display:none}
  .me-btn{padding:3px}
  #view{padding-bottom:84px}
  .brand{font-size:22px}
}

.proto{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:10px;padding:8px 12px}
.proto b{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:2px 7px}

.lbl{font:600 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--sans);padding:9px 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--doom);border-color:var(--doom);color:var(--doom-ink)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12.5px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.linkish{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}

/* ---------- avatares e estrelas ---------- */
.av{--s:24px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;background:var(--pc);color:#fff;font:700 calc(var(--s)*.44)/1 var(--sans);flex:none;box-shadow:0 0 0 2px var(--bg)}
.av.sm{--s:22px}.av.md{--s:30px}.av.lg{--s:64px}.av.xl{--s:96px}
.stack{display:flex}
.stack .av+.av{margin-left:-7px}
.stars{position:relative;display:inline-block;font-size:13px;line-height:1;letter-spacing:1px;color:var(--surface-3);white-space:nowrap;vertical-align:-1px}
.stars::before{content:"★★★★★"}
.stars::after{content:"★★★★★";position:absolute;left:0;top:0;width:var(--v);overflow:hidden;color:var(--gold)}
.stars.lg{font-size:22px;letter-spacing:2px}

/* ---------- cartaz ---------- */
.poster{position:relative;display:block;aspect-ratio:2/3;width:100%;border-radius:10px;overflow:hidden;container-type:inline-size;background:radial-gradient(130% 90% at 50% 28%,var(--pa) 0%,var(--pb) 78%);box-shadow:0 12px 30px -14px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.07);color:#fff;text-align:left;isolation:isolate}
.poster .motif{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.poster::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 1.3px) 0 0/4px 4px,linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 22%,transparent 40%,rgba(0,0,0,.9) 100%)}
.p-top{position:absolute;z-index:2;top:6cqw;left:7cqw;right:24cqw;font:600 5cqw/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.p-ess{position:absolute;z-index:2;top:16cqw;left:0;background:var(--gold);color:#1d1400;font:700 4.6cqw/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1.8cqw 3.4cqw 1.8cqw 7cqw;border-radius:0 3px 3px 0}
.p-title{position:absolute;z-index:2;left:7cqw;right:7cqw;bottom:8cqw;font-family:var(--display);text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.p-title small{display:block;font-size:6.4cqw;font-weight:700;letter-spacing:.04em;opacity:.85;margin-bottom:1.6cqw;line-height:1.05}
.p-title b{display:block;font-weight:900;line-height:.86;letter-spacing:.005em;text-wrap:balance;overflow-wrap:anywhere}
.p-title b.xl{font-size:19cqw}.p-title b.l{font-size:15cqw}.p-title b.m{font-size:12cqw}.p-title b.s{font-size:9.4cqw}
@container (max-width:110px){.p-top,.p-title,.p-ess{display:none}}

/* ---------- linha do tempo ---------- */
.hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr) minmax(0,1.15fr);gap:16px;margin-top:22px}
@media (max-width:1100px){.hero{grid-template-columns:1fr 1fr}.h-next{grid-column:1/-1}}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.h-count{background:radial-gradient(120% 140% at 0% 0%,#1b5c3f 0%,var(--doom-deep) 55%,#07140e 100%);border-color:#1f4d37}
.h-count .lbl{color:#9fd6bb}
.h-count .big{font-family:var(--display);font-weight:900;font-size:clamp(64px,7vw,96px);line-height:.82;color:var(--doom);font-variant-numeric:tabular-nums}
.h-count .big small{font-size:.32em;margin-left:8px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
.h-count .sub{font-weight:600;margin-top:12px}
.h-count .enc{font-size:12.5px;color:#b9d8c8;margin-top:6px}
.h-prog .num{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.h-prog .num span{font-size:24px;color:var(--muted);font-weight:700}
.segbar{display:flex;gap:3px;height:12px;margin:14px 0 10px}
.segbar span{position:relative;border-radius:3px;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));overflow:hidden}
.segbar span i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:3px}
.seg-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.seg-legend span{display:inline-flex;align-items:center;gap:5px}
.seg-legend i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.h-sub{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:12px}
.h-sub b{color:var(--ink);font-family:var(--mono);font-weight:600}
.h-next{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
.h-next>button{display:block;width:100%}
.h-next h3{margin:0 0 4px;font-size:18px;line-height:1.25;text-wrap:balance}
.h-next .meta{font-size:12.5px;color:var(--muted);margin-bottom:14px}

.tools{margin-top:30px;display:grid;gap:12px}
.tools-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.search:focus-within{border-color:var(--focus)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg svg{width:15px;height:15px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--doom);width:16px;height:16px}
.sagas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.sagas button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.sagas button:hover{border-color:var(--muted)}
.sagas button span{font:500 11px var(--mono);color:var(--muted)}
.sagas button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sagas button[aria-pressed="true"] span{color:inherit;opacity:.7}
.result{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px;min-height:30px}
.result b{color:var(--ink)}

.era{margin-top:42px}
.era-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:6px}
.gem{width:16px;height:16px;flex:none;background:var(--c);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.era-name{font-family:var(--display);font-weight:800;font-size:clamp(26px,3vw,36px);line-height:1;text-transform:uppercase;letter-spacing:.015em;margin:0}
.era-stone{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.era-prog{display:flex;align-items:center;gap:10px;margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.mini{width:90px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.mini i{display:block;height:100%;background:var(--c)}
.arrows{display:flex;gap:6px}
.arrows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1;padding-bottom:2px}
.arrows button:hover{border-color:var(--ink)}
.era-note{margin:0 0 4px;font-size:13px;color:var(--muted)}
.sub-head{margin:20px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sub-head b{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.sub-head span{font-size:13px;color:var(--muted)}
.sub-head .arrows{margin-left:auto}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(148px,14vw,188px);gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:32px 4px 16px;background:linear-gradient(color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 45%,transparent)) 0 15px/100% 2px no-repeat local;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px 18px;padding-top:14px}
.card{position:relative;scroll-snap-align:start;min-width:0}
.card .dot{display:none}
.rail .card .dot{display:block;position:absolute;top:-24px;left:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--c);background:var(--bg)}
.rail .card.seen .dot{background:var(--c)}
.p-wrap{position:relative}
.p-open{display:block;width:100%;border-radius:10px;transition:transform .25s ease}
.p-open:hover{transform:translateY(-4px)}
.p-open:hover .poster{box-shadow:0 20px 40px -14px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.18)}
.c-check{position:absolute;top:8px;right:8px;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(8,9,12,.55);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.55);color:transparent;transition:background .15s,color .15s}
.c-check:hover{color:rgba(255,255,255,.85);border-color:#fff}
.c-check[aria-pressed="true"]{background:var(--doom);border-color:var(--doom);color:var(--doom-ink)}
.c-check svg{width:16px;height:16px}
.card.seen .poster{box-shadow:0 12px 30px -14px rgba(0,0,0,.85),0 0 0 2px var(--doom)}
.c-info{padding-top:10px}
.c-t{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.c-t button{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-t button:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.c-meta{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;min-height:24px}
.c-avg{display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--mono)}
.c-avg i{font-style:normal;color:var(--gold)}
.c-none{font-size:12px;color:var(--faint)}
.c-soon{font-size:12px;color:var(--doom);font-weight:600}
.empty{padding:70px 0;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px}

/* ---------- detalhe (modal) ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.m-back{position:absolute;inset:0;background:rgba(4,5,8,.82);backdrop-filter:blur(6px)}
.sheet{position:relative;width:min(1000px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.6);overscroll-behavior:contain}
.m-glow{position:absolute;inset:0 0 auto 0;height:340px;background:radial-gradient(80% 100% at 15% 0%,color-mix(in srgb,var(--pa) 75%,transparent),transparent 70%);pointer-events:none}
.m-x{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:17px}
.m-x:hover{border-color:var(--ink)}
.m-grid{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px;padding:32px}
.m-left .poster{box-shadow:0 30px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1)}
.m-order{margin-top:12px;font:500 12px var(--mono);color:var(--muted);text-align:center}
.m-era{display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.m-era .gem{width:12px;height:12px}
.sheet h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,4.4vw,54px);line-height:.92;text-transform:uppercase;margin:10px 0 12px;letter-spacing:.005em;text-wrap:balance;padding-right:44px}
.m-meta{color:var(--muted);font-size:14px}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.tag{padding:4px 11px;border-radius:999px;border:1px solid var(--line-strong);font-size:12.5px;background:var(--surface-2)}
.tag:hover{border-color:var(--ink)}
.pill{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--gold);color:#1d1400}
.pill.opt{background:var(--surface-3);color:var(--muted)}
.m-crowd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.m-crowd b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.m-sec{margin-top:24px}
.m-sec h3{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.m-sec h3 span{color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:500}
.mine-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.srate{display:inline-flex;flex-direction:row-reverse}
.srate button{padding:2px;color:var(--surface-3);transition:color .12s,transform .12s}
.srate button svg{width:32px;height:32px;display:block}
.srate button.on{color:var(--gold)}
.srate:hover button{color:var(--surface-3)}
.srate button:hover,.srate button:hover~button{color:var(--gold)}
.srate button:active{transform:scale(.88)}
.rate-lbl{font-size:13.5px;color:var(--muted)}
.m-when{font-size:12.5px;color:var(--muted);margin-top:10px}
textarea{width:100%;min-height:74px;resize:vertical;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg-2);margin-bottom:10px;display:block}
textarea:focus{border-color:var(--focus);outline:none}
.friends{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.friends li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:3px 12px;align-items:center}
.friends .fn{font-weight:600}
.friends .fs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.friends q{grid-column:2;font-style:italic;font-size:14px;quotes:"“" "”"}
.m-doom{margin-top:20px;padding:18px;border-radius:12px;background:var(--doom-deep);border:1px solid #1f4d37}
.m-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.m-nav button{max-width:48%;font-size:12.5px;color:var(--muted);display:grid;gap:2px;min-width:0}
.m-nav button b{color:var(--ink);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-nav button.nx{text-align:right;margin-left:auto}
.m-nav button:hover b{text-decoration:underline}
@media (max-width:760px){
  .modal{padding:0}
  .sheet{max-height:100dvh;height:100dvh;border-radius:0;border:0}
  .m-grid{grid-template-columns:1fr;padding:20px 16px calc(32px + env(safe-area-inset-bottom,0px));gap:20px}

function splitTitle(t){
  const s=t.match(/^(.*?)\s*\(T([^)]*)\)$/);
  if(s){const n=s[2].replace(/T/g,'');return [(/ e | a /.test(n)?'Temporadas ':'Temporada ')+n,s[1]]}
  const y=t.match(/^(.*?)\s*\((\d{4})\)$/);
  if(y) return ['',y[1]];
  const i=t.indexOf(':');
  if(i>0) return [t.slice(0,i),t.slice(i+1).trim()];
  return ['',t];
}

};
const iso=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
function buildMock(){
  const RANGE={voce:['2026-09-01','2026-09-23'],caio:['2026-05-02','2026-09-21'],tercio:['2026-02-10','2026-09-22'],matheus:['2026-07-12','2026-09-19']};
  const marks={};
  PIDS.forEach(pid=>{
    marks[pid]={};
    const seen=[...EXTRAS_ORDER,...ITEMS.filter(it=>it.e<=4)].filter(it=>mockSeen(pid,it));
    const [a,b]=RANGE[pid].map(s=>new Date(s+'T12:00:00').getTime());
    seen.forEach((it,k)=>{
      const h=hash('n:'+pid+it.id);
      marks[pid][it.id]={r:(pid==='tercio'&&it.k!=='f'&&h%6===0)?null:mockRating(pid,it.id),c:(COMMENTS[pid]||{})[it.id]||'',d:iso(new Date(a+(b-a)*(seen.length>1?k/(seen.length-1):1)))};
    });
  });
  return {me:'voce',marks,prof:{}};
}

const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const hours=min=>Math.round(min/60);

function stats(pid){
  const m=S.marks[pid],ids=Object.keys(m).filter(id=>BYID[id]);
  const rs=ids.map(id=>m[id].r).filter(r=>r!=null);
  const dated=ids.filter(id=>m[id].d).sort((a,b)=>m[b].d.localeCompare(m[a].d)||BYID[b].i-BYID[a].i);
  return {
    seenMain:MAIN.filter(it=>m[it.id]).length,
    seenEss:ESS.filter(it=>m[it.id]).length,
    extras:ids.filter(id=>BYID[id].e===5).length,
    seenAll:ids.length,
    minutes:ids.reduce((a,id)=>a+(BYID[id].m||0),0),
    avg:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    rs,rated:rs.length,
    comments:ids.filter(id=>m[id].c).length,
    first:dated.length?m[dated[dated.length-1]].d:null,
    last:dated[0]||null
  };
}
function ranked(metric){const k={main:'seenMain',horas:'minutes',ess:'seenEss'}[metric];return PIDS.map(pid=>({pid,s:stats(pid)})).sort((a,b)=>b.s[k]-a.s[k]||b.s.seenAll-a.s.seenAll)}
function crowd(it){const who=PIDS.filter(pid=>S.marks[pid][it.id]);const rs=who.map(pid=>S.marks[pid][it.id].r).filter(r=>r!=null);return {who,rs,avg:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null}}
function orderedMain(){const l=ITEMS.filter(it=>it.e<=4);return UI.order==='lanc'?l.slice().sort((a,b)=>a.r<b.r?-1:a.r>b.r?1:a.i-b.i):l}
const orderedAll=()=>orderedMain().concat(EXTRAS_ORDER);
function eraOf(it){if(it.e===5||UI.order==='crono') return it.e;return BUCKETS.findIndex(b=>it.r<=b.to)}
function nextUp(){const m=S.marks[S.me];return orderedMain().find(it=>!m[it.id]&&!it.opt&&it.id!=='doomsday')}
function passes(it){
  const m=S.marks[S.me],q=UI.q.trim();
  if(UI.type==='star'&&!it.star) return false;
  if(UI.type==='film'&&it.k==='s') return false;
  if(UI.type==='series'&&it.k!=='s') return false;
  if(UI.saga&&!it.fr.includes(UI.saga)) return false;
  if(UI.hide&&m[it.id]) return false;
  if(q&&!norm(it.t).includes(norm(q))) return false;
  return true;
}

function perfilHTML(){
  const pid=UI.profile&&PIDS.includes(UI.profile)?UI.profile:S.me;
  const p=P(pid),s=stats(pid),isMe=pid===S.me,m=S.marks[pid];
  const pos=ranked('main').findIndex(x=>x.pid===pid)+1;
  const d=Math.max(0,daysTo(2026,12,18));
  const miss=ESS.filter(it=>!m[it.id]);
  const perWeek=d>0?miss.length/(d/7):miss.length;
  const missMin=miss.reduce((a,it)=>a+(it.m||0),0);
  const quem=isMe?'você':esc(p.name);
  const eras=ERAS.map((e,idx)=>{const all=ITEMS.filter(it=>it.e===idx&&it.id!=='doomsday'),k=all.filter(it=>m[it.id]).length;return `<div class="er" style="--c:var(--${e.key})"><span>${esc(e.name)}</span><span class="n">${k}/${all.length}</span><span class="bar"><i style="width:${k/all.length*100}%"></i></span></div>`}).join('');
  const cnt=[0,1,2,3,4,5].map(v=>s.rs.filter(r=>r===v).length),mx=Math.max(1,...cnt);
  const hist=[5,4,3,2,1].map(v=>`<div class="hr">${starsHTML(v)}<span class="hb"><i style="width:${cnt[v]/mx*100}%"></i></span><span class="n">${cnt[v]}</span></div>`).join('');
  const ids=Object.keys(m).filter(id=>BYID[id]);
  const favs=ids.filter(id=>m[id].r!=null).sort((a,b)=>m[b].r-m[a].r||(m[b].d||'').localeCompare(m[a].d||'')).slice(0,10).map(id=>miniCard(BYID[id],m[id].r)).join('');
  const recent=ids.sort((a,b)=>(m[b].d||'').localeCompare(m[a].d||'')||BYID[b].i-BYID[a].i).slice(0,8).map(id=>{const it=BYID[id],x=m[id];return `<li><button data-open="${id}">${posterHTML(it)}<span><span class="rt">${esc(it.t)}</span><span class="rd">${x.d?fmtDate(x.d):''}${x.c?` · “${esc(x.c)}”`:''}</span></span>${x.r!=null?starsHTML(x.r):'<span class="rd">sem nota</span>'}</button></li>`}).join('');
  const edit=isMe&&UI.editing?`<form class="edit" id="editForm"><div><label class="lbl" for="pf-name">Nome</label><input type="text" id="pf-name" maxlength="20" value="${esc(p.name)}" required></div><div><span class="lbl">Cor do perfil</span><div class="swatches" role="group" aria-label="Cor do perfil">${SWATCHES.map(c=>`<button type="button" data-sw="${c}" style="--sw:${c}" aria-pressed="${c===UI.editColor}" aria-label="Cor ${c}"></button>`).join('')}</div></div><div class="row-btns"><button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" data-edit>Cancelar</button></div><p class="muted" style="margin:0;font-size:12.5px">No site de verdade isso fica salvo na sua conta.</p></form>`:'';
  return `<div class="pf-pick"><span class="lbl">Ver perfil de</span>${PIDS.map(x=>`<button data-profile="${x}" aria-pressed="${x===pid}">${av(x,'sm')}${esc(P(x).name)}${x===S.me&&P(x).name!=='Você'?' (você)':''}</button>`).join('')}</div>
  <div class="pf-head" style="--pc:${p.color}">${av(pid,'xl')}<div><span class="lbl">${isMe?'Seu perfil':'Perfil'}</span><h1>${esc(p.name)}</h1><div class="pf-sub">${pos}º no ranking · na maratona desde ${s.first?fmtDate(s.first):'hoje'} · ${s.comments} comentário${s.comments===1?'':'s'}</div></div><div class="pf-actions">${isMe?`<button class="btn" data-edit>${UI.editing?'Fechar edição':'Editar perfil'}</button>`:`<button class="btn" data-profile="${S.me}">Ver meu perfil</button>`}</div></div>
  ${edit}
  <div class="tiles">
    <div class="tile stat"><span class="lbl">Linha principal</span><div class="v">${s.seenMain}<small>/${MAIN.length}</small></div><div class="d">${Math.round(s.seenMain/MAIN.length*100)}% da linha do tempo</div></div>
    <div class="tile stat"><span class="lbl">Essenciais</span><div class="v">${s.seenEss}<small>/${ESS.length}</small></div><div class="d">${miss.length?`Faltam ${miss.length}`:'Todos vistos'}</div></div>
    <div class="tile stat"><span class="lbl">Horas assistidas</span><div class="v">${hours(s.minutes)}<small>h</small></div><div class="d">≈ ${fmt(s.minutes/60/24)} dias sem parar</div></div>
    <div class="tile stat"><span class="lbl">Média das notas</span><div class="v">${s.avg!=null?fmt(s.avg):'–'}<small>★</small></div><div class="d">${s.rated} títulos avaliados</div></div>
    <div class="tile stat"><span class="lbl">Extras</span><div class="v">${s.extras}</div><div class="d">X-Men, Aranhas antigos e cia.</div></div>
  </div>
  <div class="pf-cols">
    <div class="tile"><span class="lbl">Progresso por era</span><div class="eras-list">${eras}</div><div class="pace">${miss.length?`<b>${fmt(perWeek)}</b> essenciais por semana é o ritmo pra ${quem} ver os ${miss.length} que faltam (≈ ${hours(missMin)}h) até 18/12.`:'<b>Pronto</b> pra Doomsday: todos os essenciais vistos.'}</div></div>
    <div class="tile"><span class="lbl">Como ${isMe?'você avalia':esc(p.name)+' avalia'}</span><div class="hist">${hist}</div></div>
  </div>
  <section class="section"><h2>Favoritos</h2><p>As notas mais altas ${isMe?'que você deu':'de '+esc(p.name)}.</p>${favs?`<div class="minis">${favs}</div>`:'<p class="muted">Nenhuma nota ainda.</p>'}</section>
  <section class="section"><h2>Vistos recentemente</h2>${recent?`<ul class="recent">${recent}</ul>`:'<p class="muted">Nada marcado ainda.</p>'}</section>
  <section class="section"><h2>Essenciais que faltam</h2><p>${miss.length} ${miss.length===1?'título':'títulos'} pra chegar pronto em Doomsday.</p>${miss.length?`<div class="minis">${miss.map(it=>miniCard(it,null)).join('')}</div>`:'<p class="muted">Nenhum. Pronto pra estreia!</p>'}</section>`;
}

/* ================= DETALHE ================= */
let lastFocusId=null;
function modalHTML(it){
  const mine=S.marks[S.me][it.id],fin=it.id==='doomsday',c=crowd(it),era=ERAS[it.e],st=styleOf(it);
  const seq=orderedAll(),ix=seq.findIndex(x=>x.id===it.id),prev=seq[ix-1],next=seq[ix+1];
  const group=it.g?GROUPS.find(g=>g.key===it.g):null;
  const others=PIDS.filter(pid=>pid!==S.me).map(pid=>{const x=S.marks[pid][it.id];return `<li>${av(pid,'md')}<div><span class="fn">${esc(P(pid).name)}</span><div class="fs">${x?(x.r!=null?`${starsHTML(x.r)} ${RLBL[x.r]}`:'viu, sem nota')+(x.d?` · ${fmtDate(x.d)}`:''):'ainda não viu'}</div></div>${x&&x.c?`<q>${esc(x.c)}</q>`:''}</li>`}).join('');
  const rate=[5,4,3,2,1].map(v=>`<button data-rate="${v}" data-fk="r${v}" class="${mine&&mine.r>=v?'on':''}" aria-label="${v} estrela${v>1?'s':''}: ${RLBL[v]}" aria-pressed="${!!mine&&mine.r===v}">${IC.star}</button>`).join('');
  const d=daysTo(2026,12,18);
  const mineSec=fin?`<div class="m-doom"><span class="lbl" style="color:#9fd6bb">Estreia</span><div style="font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;color:var(--doom)">${d>0?d+' dias':'Em cartaz'}</div><p style="margin:8px 0 0">18 de dezembro de 2026. Dá pra marcar e avaliar depois da estreia.</p></div>`:
  `<section class="m-sec"><h3>Sua avaliação${S.me!=='voce'?` <span>· como ${esc(P(S.me).name)}</span>`:''}</h3>
    <div class="mine-row"><button class="btn ${mine?'on':''}" data-toggle="${it.id}" data-fk="tog">${mine?'✓ Visto':'Marcar como visto'}</button><div class="srate" role="group" aria-label="Sua nota">${rate}</div><span class="rate-lbl">${mine&&mine.r?RLBL[mine.r]:'Toque nas estrelas'}</span></div>
    ${mine&&mine.d?`<div class="m-when">Visto em ${fmtDate(mine.d)}${mine?'. Clique em “Visto” pra desmarcar.':''}</div>`:''}
    <label for="m-c" class="lbl" style="margin-top:18px">Comentário</label>
    <textarea id="m-c" maxlength="140" placeholder="O que achou? (opcional)">${esc(mine?mine.c:'')}</textarea>
    <button class="btn" data-save-c="${it.id}" data-fk="save">Salvar comentário</button></section>`;
  return `<div class="m-back" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" style="--pa:${st.a};--pb:${st.b}">
    <div class="m-glow" aria-hidden="true"></div>
    <button class="m-x" data-close data-fk="close" aria-label="Fechar">✕</button>
    <div class="m-grid">
      <div class="m-left">${posterHTML(it)}<div class="m-order">${it.num?`Nº ${it.num} de ${CRONO_TOTAL} na ordem cronológica`:'Fora da linha do tempo principal'}</div></div>
      <div class="m-right">
        <div class="m-era" style="--c:var(--${era.key})"><span class="gem" aria-hidden="true"></span>${esc(group?group.name:era.name)} · ${era.stone}</div>
        <h2 id="m-title">${esc(it.t)}</h2>
        <div class="m-meta">${KIND[it.k]} · lançado em ${it.r.slice(0,4)}${it.m?' · '+dur(it)+(it.k==='s'?' no total':''):''}${it.n?` · ${esc(it.n)}`:''}${group?` · ${esc(group.hint)}`:''}</div>
        <div class="m-tags">${it.star?'<span class="pill">★ Essencial pra Doomsday</span>':''}${it.opt?'<span class="pill opt">Opcional</span>':''}${it.fr.map(x=>`<button class="tag" data-saga="${x}" title="Ver só ${esc(SAGA[x])}">${esc(SAGA[x])}</button>`).join('')}</div>
        <div class="m-crowd">${c.avg!=null?`<b>${fmt(c.avg)}</b>${starsHTML(c.avg,'lg')}<span class="muted">média da turma · ${c.who.length} de ${PIDS.length} já viram</span>`:fin?'<span class="muted">Ninguém viu ainda: estreia em 18/12.</span>':`<span class="muted">${c.who.length?`${c.who.length} de ${PIDS.length} já viram, ninguém deu nota ainda.`:'Ninguém da turma viu ainda. Seja o primeiro.'}</span>`}</div>
        ${mineSec}
        <section class="m-sec"><h3>A turma</h3><ul class="friends">${others}</ul></section>
        <div class="m-nav">${prev?`<button data-open="${prev.id}" data-fk="prev"><span>‹ Anterior</span><b>${esc(prev.t)}</b></button>`:''}${next?`<button class="nx" data-open="${next.id}" data-fk="next"><span>Próximo ›</span><b>${esc(next.t)}</b></button>`:''}</div>
      </div>
    </div>
  </div>`;
}
function renderModal(keepScroll){
  const el=document.getElementById('modal'),it=BYID[UI.modal];if(!it) return;
  const old=el.querySelector('.sheet'),sc=old?old.scrollTop:0;
  el.innerHTML=modalHTML(it);
  if(keepScroll) el.querySelector('.sheet').scrollTop=sc;
}
function openModal(id){
  if(!UI.modal) lastFocusId=id;
  UI.modal=id;UI.menu=false;
  renderModal(false);
  const el=document.getElementById('modal');el.hidden=false;
  document.documentElement.style.overflow='hidden';
  el.querySelector('.m-x').focus({preventScroll:true});
}
function closeModal(){
  const id=lastFocusId;
  UI.modal=null;const el=document.getElementById('modal');el.hidden=true;el.innerHTML='';
  document.documentElement.style.overflow='';
  const back=id&&(document.querySelector(`.p-open[data-open="${id}"]`)||document.querySelector(`[data-open="${id}"]`));
  if(back) back.focus({preventScroll:true});
}

/* ================= RENDER GERAL ================= */
function renderView(){
  const v=document.getElementById('view');
  if(UI.tab==='linha'){v.innerHTML=`<div id="hero" class="hero"></div>${toolsHTML()}<div id="result" class="result"></div><div id="eras"></div>`;updateLinha()}
  else if(UI.tab==='ranking') v.innerHTML=rankingHTML();
  else v.innerHTML=perfilHTML();
}
function refresh(){
  const a=document.activeElement,fk=a&&a.dataset?a.dataset.fk:null;
  renderBar();
  if(UI.tab==='linha'&&document.getElementById('eras')) updateLinha(); else renderView();
  if(UI.modal) renderModal(true);
  if(fk){const el=document.querySelector(`[data-fk="${fk}"]`);if(el) el.focus({preventScroll:true})}
}
function go(tab){
  UI.tab=tab;UI.menu=false;if(tab!=='perfil') UI.editing=false;
  renderBar();renderView();window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+tab)}catch(e){}
}

/* ================= AÇÕES ================= */
function setMark(id,patch){
  const m=S.marks[S.me];
  if(patch===null) delete m[id];
  else m[id]=Object.assign({r:null,c:'',d:iso(new Date())},m[id]||{},patch);
  save();refresh();
}
function toggleSeen(id){
  const it=BYID[id];if(!it||id==='doomsday') return;
  const was=!!S.marks[S.me][id];
  setMark(id,was?null:{});
  toast(was?`Desmarcado: ${it.t}`:`Visto: ${it.t}`);
}
function rate(id,v){
  const cur=S.marks[S.me][id],nv=cur&&cur.r===v?null:v;
  setMark(id,{r:nv});
  toast(nv?`${nv} estrela${nv>1?'s':''} · ${RLBL[nv]}`:'Nota removida');
}

document.addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);let el;
  if(UI.menu&&!q('.me')){UI.menu=false;renderBar()}
  if(q('[data-close]')){closeModal();return}
  if(el=q('[data-saga-chip]')){UI.saga=el.dataset.sagaChip||null;updateLinha();return}
  if(el=q('[data-saga]')){UI.saga=el.dataset.saga;UI.type='all';UI.hide=false;UI.q='';closeModal();if(UI.tab!=='linha') go('linha'); else updateLinha();const tl=document.querySelector('.tools');if(tl) tl.scrollIntoView({block:'start',behavior:reduced()?'auto':'smooth'});toast(`Mostrando só ${SAGA[UI.saga]}`);return}
  if(el=q('[data-seg] button')){const k=el.closest('[data-seg]').dataset.seg;UI[k]=el.dataset.v;if(k==='order'||k==='view') savePrefs();if(UI.tab==='linha') updateLinha(); else renderView();return}
  if(el=q('[data-toggle]')){toggleSeen(el.dataset.toggle);return}
  if(el=q('[data-rate]')){rate(UI.modal,+el.dataset.rate);return}
  if(el=q('[data-save-c]')){const ta=document.getElementById('m-c');setMark(el.dataset.saveC,{c:ta.value.trim()});toast(ta.value.trim()?'Comentário salvo':'Comentário apagado');return}
  if(el=q('[data-open]')){e.preventDefault();openModal(el.dataset.open);return}
  if(el=q('[data-profile]')){UI.profile=el.dataset.profile;UI.editing=false;go('perfil');return}
  if(el=q('[data-person]')){S.me=el.dataset.person;UI.menu=false;UI.profile=null;UI.editing=false;save();refresh();toast(`Agora você está como ${P(S.me).name}`);return}
  if(q('[data-menu]')){UI.menu=!UI.menu;renderBar();return}
  if(q('[data-edit]')){UI.editing=!UI.editing;UI.editColor=P(S.me).color;renderView();if(UI.editing){const i=document.getElementById('pf-name');if(i) i.focus()}return}
  if(el=q('[data-sw]')){UI.editColor=el.dataset.sw;document.querySelectorAll('[data-sw]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sw===UI.editColor)));return}
  if(el=q('[data-scroll]')){const r=document.querySelector(`.rail[data-rail="${el.dataset.railBtn}"]`);if(r) r.scrollBy({left:(+el.dataset.scroll)*r.clientWidth*.85,behavior:reduced()?'auto':'smooth'});return}
  if(q('[data-clear]')){UI.type='all';UI.hide=false;UI.q='';UI.saga=null;updateLinha();return}
  if(el=q('[data-tab]')){e.preventDefault();go(el.dataset.tab);return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;updateLinha()}});
document.addEventListener('change',e=>{if(e.target.id==='hide'){UI.hide=e.target.checked;updateLinha()}});
document.addEventListener('submit',e=>{
  if(e.target.id!=='editForm') return;
  e.preventDefault();
  const name=document.getElementById('pf-name').value.trim().slice(0,20);
  if(!name){toast('Escreva um nome');return}
  S.prof[S.me]={name,color:UI.editColor||P(S.me).color};
  UI.editing=false;save();refresh();toast('Perfil atualizado');
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(UI.modal){closeModal();return}
  if(UI.menu){UI.menu=false;renderBar()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==UI.tab) go(h)});

renderBar();renderView();
})();
</script>
