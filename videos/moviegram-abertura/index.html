<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=block" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Vinheta do Moviegram, 16:9. A versão vertical (compositions/vertical.html) usa o mesmo desenho com outras medidas. */
      :root {
        --bg: #0b0b0c;
        --ink: #f2f1ee;
        --accent: #e5484d;
        --track: rgba(242, 241, 238, 0.42);
        --faint: rgba(242, 241, 238, 0.34);
        --label: rgba(242, 241, 238, 0.5);
        /* tamanho do nome; o símbolo e os espaços saem dele */
        --type: 232px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        background: var(--bg);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Big Shoulders Display", sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      /* fundo: brilho vermelho que nasce com a estreia */
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--type) * 5.2);
        height: calc(var(--type) * 5.2);
        margin: calc(var(--type) * -2.6) 0 0 calc(var(--type) * -2.6);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(229, 72, 77, 0.2) 0%, rgba(229, 72, 77, 0.07) 38%, rgba(229, 72, 77, 0) 68%);
      }
      /* régua da linha do tempo: de 2008 à estreia */
      .ruler {
        position: absolute;
        left: 50%;
        bottom: 15%;
        width: 62%;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        gap: calc(var(--type) * 0.1);
        font-weight: 700;
        font-size: calc(var(--type) * 0.105);
        letter-spacing: 0.14em;
        color: var(--label);
      }
      .ticks {
        flex: 1;
        height: calc(var(--type) * 0.07);
        margin-bottom: calc(var(--type) * 0.022);
        background: repeating-linear-gradient(90deg, var(--faint) 0 2px, transparent 2px calc(var(--type) * 0.16));
        transform-origin: left center;
      }
      /* logo no estado final: símbolo + nome, centralizados */
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(var(--type) * 0.2);
        padding: 80px;
      }
      .mark {
        flex: none;
        width: calc(var(--type) * 1.36);
        height: calc(var(--type) * 0.68);
        overflow: visible;
      }
      .mark .line {
        fill: none;
        stroke: var(--track);
        stroke-width: 2;
        stroke-linecap: round;
      }
      .mark .node {
        fill: var(--ink);
      }
      .mark .premiere {
        fill: var(--accent);
      }
      .mark .ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
      }
      .wordmark {
        display: flex;
        font-weight: 900;
        font-size: var(--type);
        line-height: 0.9;
        letter-spacing: 0.005em;
        white-space: nowrap;
      }
      /* cada parte do nome sobe de trás de uma máscara */
      .word {
        display: block;
        overflow: hidden;
        padding: 0.06em 0 0.08em;
      }
      .word span {
        display: block;
      }
      .word.gram {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-w2m1" id="stage" data-composition-id="main" data-start="0" data-duration="3.6" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-qhd5" id="sting" class="scene">
        <div data-hf-id="hf-35j2" class="glow" id="glow"></div>
        <div data-hf-id="hf-wfaq" class="ruler" id="ruler"><span data-hf-id="hf-4imy" id="y1">2008</span><span data-hf-id="hf-fmqf" class="ticks" id="ticks"></span><span data-hf-id="hf-hrwd" id="y2">2026</span></div>
        <div data-hf-id="hf-mcm7" class="content">
          <svg data-hf-id="hf-yqzo" class="mark" id="mark" viewBox="0 0 64 32" aria-hidden="true">
            <line data-hf-id="hf-9dwv" class="line" id="line" x1="8" y1="16" x2="48" y2="16" />
            <circle data-hf-id="hf-37tx" class="node" id="n1" cx="8" cy="16" r="4" />
            <circle data-hf-id="hf-g0yy" class="node" id="n2" cx="24" cy="16" r="4" />
            <circle data-hf-id="hf-iu36" class="ring" id="ring" cx="48" cy="16" r="11" />
            <circle data-hf-id="hf-q5zy" class="premiere" id="n3" cx="48" cy="16" r="11" />
          </svg>
          <div data-hf-id="hf-jiyy" class="wordmark" id="wordmark">
            <span data-hf-id="hf-yhox" class="word"><span data-hf-id="hf-pfw5" id="w1" data-layout-allow-overflow="true">Movie</span></span><span data-hf-id="hf-pf4m" class="word gram"><span data-hf-id="hf-kdin" id="w2" data-layout-allow-overflow="true">gram</span></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      // A linha do tempo só é montada depois da fonte carregar: o deslocamento do símbolo depende da largura do nome.
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("stage");
        const mark = document.getElementById("mark");
        const line = document.getElementById("line");

        // Começa com o símbolo sozinho no centro e maior; depois ele recua pro lugar dele no logo.
        const sr = stage.getBoundingClientRect();
        const mr = mark.getBoundingClientRect();
        const dx = sr.left + sr.width / 2 - (mr.left + mr.width / 2);
        const BIG = 1.9;

        const len = line.getTotalLength();
        line.style.strokeDasharray = `${len}`;

        // fundo: a régua aparece discreta junto com a linha
        tl.fromTo("#y1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "sine.out" }, 0.15);
        tl.fromTo("#ticks", { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 1.0, ease: "power1.inOut" }, 0.2);
        tl.fromTo("#y2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "sine.out" }, 1.05);

        // símbolo no centro, grande, durante o desenho
        tl.set(mark, { x: dx, scale: BIG, transformOrigin: "50% 50%" }, 0);

        // 1. a linha se desenha
        tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.15);

        // 2. os pontos acendem quando a linha passa
        tl.fromTo("#n1", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(2.4)" }, 0.3);
        tl.fromTo("#n2", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(2.4)" }, 0.58);

        // 3. a estreia: ponto vermelho, anel e brilho
        tl.fromTo("#n3", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0.98);
        tl.set("#ring", { autoAlpha: 0 }, 0);
        tl.fromTo("#ring", { scale: 1, autoAlpha: 0.75, transformOrigin: "50% 50%" }, { scale: 2.5, autoAlpha: 0, duration: 0.8, ease: "power1.out", immediateRender: false }, 1.02);
        tl.fromTo("#glow", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.9, ease: "sine.out" }, 1.0);

        // 4. o símbolo recua pro logo e o nome sobe
        tl.to(mark, { x: 0, scale: 1, duration: 0.62, ease: "power3.inOut" }, 1.45);
        tl.fromTo("#w1", { yPercent: 108 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 1.92);
        tl.fromTo("#w2", { yPercent: 108 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 2.03);

        // 5. segura; o ponto vermelho respira uma vez
        tl.to("#n3", { scale: 1.08, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.66);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
