<!doctype html>
<!-- Fonte da imagem de compartilhamento (public/og.png), 1200x630.
     Gerar: msedge --headless=new --window-size=1200,630 --virtual-time-budget=8000
            --screenshot=public/og.png scripts/og.html -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:
      radial-gradient(ellipse 720px 420px at 50% 46%, rgba(229,72,77,.16), rgba(229,72,77,.05) 55%, transparent 100%),
      #0B0B0C;
    color:#F2F1EE;
  }
  .brand{display:flex;align-items:center;gap:.2em;font-size:168px}
  .mark{flex:none;width:1.36em;height:.68em;color:#F2F1EE}
  .wordmark{font:900 1em/1 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;letter-spacing:.005em}
  .wordmark span{color:#E5484D}
  p{margin:0;font:500 34px/1.2 "Archivo",system-ui,sans-serif;color:rgba(242,241,238,.64);letter-spacing:.005em}
</style>
</head>
<body>
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 32" aria-hidden="true"><line x1="8" y1="16" x2="48" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".42"/><circle cx="8" cy="16" r="4" fill="currentColor"/><circle cx="24" cy="16" r="4" fill="currentColor"/><circle cx="48" cy="16" r="11" fill="#E5484D"/></svg>
    <span class="wordmark">Movie<span>gram</span></span>
  </div>
  <p>A linha do tempo da Marvel com a sua turma</p>
</body>
</html>
